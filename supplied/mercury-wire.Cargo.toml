[package]
name = "mercury_wire"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]

[features]
default = []

[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lib]
path = "src/lib.rs"

[[bin]]
name = "quantum-agent-demo"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

# mlock is best-effort: the process needs an adequate RLIMIT_MEMLOCK.
# The implementation never treats mlock failure as evidence of physical pinning.
