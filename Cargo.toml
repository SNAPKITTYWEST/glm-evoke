[package]
name = "glm-evoke"
version = "0.1.0"
edition = "2021"

[dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
safetensors = "0.4"
thiserror = "1"
bytes = "1"
memmap2 = "0.9"
libc = "0.2"
tracing = "0.1"
async-nats = "0.50.0"
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
